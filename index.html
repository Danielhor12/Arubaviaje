<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aruba 2026 🇦🇼</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #F4F5F7; --card: #FFFFFF; --text: #111827; --text-light: #6B7280;
            --border: #E5E7EB; --primary: #00A896; --wa: #25D366; --danger: #EF4444;
            --radius: 16px;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }

        .hero {
            background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1544281679-052a210740e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80') center/cover;
            height: 220px; display: flex; align-items: flex-end; padding: 24px; color: white;
        }
        .hero-content { max-width: 800px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; }
        .hero h1 { margin: 0 0 4px 0; font-size: 32px; font-weight: 700; }
        .sync-badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; backdrop-filter: blur(5px); }

        .container { max-width: 800px; margin: -20px auto 50px; padding: 0 16px; position: relative; z-index: 10; }

        /* Pestañas */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(255,255,255,0.9); padding: 6px; border-radius: 99px; overflow-x: auto; scrollbar-width: none;}
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 10px 16px; background: transparent; border: none; font-size: 14px; font-weight: 600; color: var(--text-light); cursor: pointer; border-radius: 99px; white-space: nowrap;}
        .tab-btn.active { background: var(--text); color: white; }

        .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Formularios */
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; background: #F9FAFB; padding: 16px; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border);}
        .form-row input, .form-row select { flex: 1; min-width: 130px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: 'Inter'; outline:none;}
        .form-row input:focus, .form-row select:focus { border-color: var(--primary); }
        .btn-add { padding: 12px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap;}
        
        /* Botones de Acción (WhatsApp y Docs) */
        .btn-wa { background: var(--wa); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;}
        .btn-doc { background: #EEF2FF; color: #4F46E5; border: 1px solid #C7D2FE; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;}
        .btn-del { background: transparent; color: var(--text-light); border: none; font-size: 18px; cursor: pointer; padding: 4px;}

        /* Itinerario (Horas) */
        .day-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
        .day-nav::-webkit-scrollbar { height: 0; }
        .day-btn { padding: 8px 16px; border: none; background: transparent; color: var(--text-light); font-weight: 600; cursor: pointer; border-radius: 8px;}
        .day-btn.active { background: #E5E7EB; color: var(--text); }

        .timeline-item { display: flex; gap: 16px; margin-bottom: 16px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px;}
        .time-badge { background: var(--text); color: white; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 14px; white-space: nowrap;}
        .timeline-content { flex: 1; }
        .timeline-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;}

        /* Reservas */
        .res-item { padding: 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; }
        .res-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: #F3F4F6; color: var(--text-light);}
        .res-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border);}

        /* Gastos y Súper */
        .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .balance-card { padding: 16px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .exp-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center; }

        @media (max-width: 600px) { .form-row input, .form-row select, .btn-add { min-width: 100%; flex: none; } }
    </style>
</head>
<body>

    <div class="hero">
        <div class="hero-content">
            <div>
                <h1>Aruba 2026</h1>
                <p style="margin:0; opacity:0.9;">Planificación del Grupo</p>
            </div>
            <span class="sync-badge" id="sync-status">🟡 Conectando...</span>
        </div>
    </div>

    <div class="container">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('itinerary', this)">📍 Itinerario</button>
            <button class="tab-btn" onclick="switchTab('reservations', this)">🎫 Reservas & Docs</button>
            <button class="tab-btn" onclick="switchTab('super', this)">🛒 Súper</button>
            <button class="tab-btn" onclick="switchTab('expenses', this)">💸 Gastos</button>
        </div>

        <!-- 1: ITINERARIO (Con Horas) -->
        <div id="view-itinerary" class="view-section active card">
            <div class="day-nav" id="day-nav"></div>
            
            <div class="form-row">
                <input type="time" id="itTime" required>
                <input type="text" id="itText" placeholder="Actividad (Ej. Desayuno, Playa)">
                <select id="itPerson"></select>
                <button class="btn-add" onclick="addItinerary()">Añadir a la Agenda</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="margin:0;">Agenda del Día</h3>
                <button class="btn-wa" onclick="shareDayWhatsApp()">💬 Enviar Día al Grupo</button>
            </div>
            
            <div id="it-content"></div>
        </div>

        <!-- 2: RESERVAS Y DOCS (Con Link obligatorio) -->
        <div id="view-reservations" class="view-section card">
            <h3 style="margin-top:0;">Archivos y Reservas</h3>
            <p style="color:var(--text-light); font-size:14px; margin-top:-10px;">Guarda aquí los PDF de Tours, Restaurantes, Vuelos o Airbnb.</p>
            
            <div class="form-row">
                <select id="resCategory">
                    <option value="🍽️ Restaurante">🍽️ Restaurante</option>
                    <option value="🏖️ Tour/Excursión">🏖️ Tour/Excursión</option>
                    <option value="✈️ Vuelo">✈️ Vuelo</option>
                    <option value="🏠 Hospedaje">🏠 Hospedaje</option>
                    <option value="🚗 Auto">🚗 Auto</option>
                </select>
                <input type="text" id="resText" placeholder="Detalle (Ej. Cena en Zeerovers)">
                <input type="url" id="resLink" placeholder="Pega el Link del PDF / Foto" style="min-width: 100%;">
                <button class="btn-add" onclick="addReservation()" style="width: 100%;">Guardar Reserva</button>
            </div>
            
            <div id="res-content"></div>
        </div>

        <!-- 3: SUPERMERCADO -->
        <div id="view-super" class="view-section card">
            <h3 style="margin-top:0;">Lista de Compras</h3>
            <div class="form-row">
                <input type="text" id="supItem" placeholder="Ej. Agua, Cerveza, Huevos..." autocomplete="off">
                <button class="btn-add" onclick="addSuper()">Agregar</button>
            </div>
            <div id="super-content"></div>
        </div>

        <!-- 4: GASTOS -->
        <div id="view-expenses" class="view-section card">
            <h3 style="margin-top:0;">Cuentas Grupales (USD)</h3>
            <div class="balance-grid" id="balances-content"></div>

            <h3 style="margin-top:20px;">Registrar Gasto</h3>
            <div class="form-row" style="margin-bottom: 24px;">
                <input type="text" id="expConcept" placeholder="Concepto" autocomplete="off">
                <input type="number" id="expAmount" placeholder="Monto" step="0.01">
                <select id="expCurrency" style="max-width: 100px;">
                    <option value="USD">USD ($)</option>
                    <option value="AWG">AWG</option>
                </select>
                <select id="expPerson"></select>
                <button class="btn-add" onclick="addExpense()">Registrar</button>
            </div>
            <h3>Historial</h3>
            <div id="expenses-list"></div>
        </div>

    </div>

    <script>
        // ⚠️ PEGA AQUÍ TU URL DE APPS SCRIPT
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwGNmGtKkeep8XxpluuHjX3ZKj7dXUSxriMGg_gz7QWL8OwsBMDSSJrE_X33302K_A/exec"; 
        const TASA_FLORIN = 1.80;

        const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
        const people = ['Daniel', 'Carlos', 'Miguel', 'Desiree'];
        
        let itinerary = JSON.parse(localStorage.getItem('ar26_it')) || [];
        let reservations = JSON.parse(localStorage.getItem('ar26_res')) || [];
        let supermarket = JSON.parse(localStorage.getItem('ar26_sup')) || [];
        let expenses = JSON.parse(localStorage.getItem('ar26_exp')) || [];
        
        let currentDay = days[0];

        window.onload = () => {
            people.forEach(p => {
                document.getElementById('itPerson').add(new Option(p, p));
                document.getElementById('expPerson').add(new Option(p, p));
            });
            renderDayNav(); renderAll(); syncWithCloud('GET'); 
        };

        function switchTab(tab, btn) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            btn.classList.add('active');
        }

        function renderAll() { renderItinerary(); renderReservations(); renderSuper(); renderExpenses(); }

        // --- ITINERARIO (Por Horas) ---
        function renderDayNav() {
            document.getElementById('day-nav').innerHTML = days.map(d => `<button class="day-btn ${currentDay === d ? 'active' : ''}" onclick="setDay('${d}')">${d}</button>`).join('');
        }
        function setDay(d) { currentDay = d; renderDayNav(); renderItinerary(); }

        function addItinerary() {
            const time = document.getElementById('itTime').value;
            const text = document.getElementById('itText').value.trim();
            if(!time || !text) return alert("Ingresa la hora y la actividad");
            
            itinerary.push({ id: 'i_' + Date.now(), day: currentDay, time: time, text: text, assignee: document.getElementById('itPerson').value, completed: false });
            document.getElementById('itText').value = ''; saveData();
        }

        function toggleIt(id) { const i = itinerary.find(x => x.id === id); if(i) { i.completed = !i.completed; saveData(); } }
        function deleteIt(id) { itinerary = itinerary.filter(i => i.id !== id); saveData(); }

        function formatTime(time24) {
            let [h, m] = time24.split(':'); let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; return `${h}:${m} ${ampm}`;
        }

        function renderItinerary() {
            const container = document.getElementById('it-content');
            let dayTasks = itinerary.filter(i => i.day === currentDay).sort((a,b) => a.time.localeCompare(b.time));
            
            container.innerHTML = dayTasks.length === 0 ? `<p style="text-align:center; color:var(--text-light);">No hay agenda para el ${currentDay}.</p>` : dayTasks.map(t => `
                <div class="timeline-item" style="${t.completed ? 'opacity:0.5;' : ''}">
                    <div class="time-badge">${formatTime(t.time)}</div>
                    <div class="timeline-content">
                        <div class="timeline-title">
                            <span style="${t.completed ? 'text-decoration:line-through;' : ''}">${t.text}</span>
                            <button class="btn-del" onclick="deleteIt('${t.id}')">🗑️</button>
                        </div>
                        <div style="font-size:13px; color:var(--text-light); margin-top:4px;">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleIt('${t.id}')"> Marcar como hecho • 👤 ${t.assignee}
                        </div>
                    </div>
                </div>`).join('');
        }

        function shareDayWhatsApp() {
            let dayTasks = itinerary.filter(i => i.day === currentDay).sort((a,b) => a.time.localeCompare(b.time));
            if(dayTasks.length === 0) return alert("No hay actividades para enviar.");
            let msg = `*🗓️ Agenda Aruba - ${currentDay}*\n\n`;
            dayTasks.forEach(t => { msg += `⏰ ${formatTime(t.time)} - ${t.text}\n`; });
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // --- RESERVAS Y DOCS ---
        function addReservation() {
            const text = document.getElementById('resText').value.trim();
            const link = document.getElementById('resLink').value.trim();
            if(!text || !link) return alert("Ingresa el detalle de la reserva y el link del PDF o foto.");
            
            reservations.push({ id: 'r_' + Date.now(), category: document.getElementById('resCategory').value, text: text, evidenceLink: link });
            document.getElementById('resText').value = ''; document.getElementById('resLink').value = ''; saveData();
        }
        function deleteRes(id) { reservations = reservations.filter(r => r.id !== id); saveData(); }

        function shareResWhatsApp(cat, text, link) {
            let msg = `*Nueva Reserva Aruba 🇦🇼*\n${cat}: ${text}\n📄 Ver archivo: ${link}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function renderReservations() {
            const container = document.getElementById('res-content');
            container.innerHTML = reservations.length === 0 ? `<p style="text-align:center; color:var(--text-light);">Sin reservas guardadas.</p>` : reservations.map(r => `
                <div class="res-item">
                    <div class="res-header"><span class="badge">${r.category}</span><button class="btn-del" onclick="deleteRes('${r.id}')">🗑️</button></div>
                    <div style="font-weight:600; font-size:16px;">${r.text}</div>
                    <div class="res-actions">
                        <a href="${r.evidenceLink}" target="_blank" class="btn-doc">📄 Abrir PDF / Foto</a>
                        <button class="btn-wa" onclick="shareResWhatsApp('${r.category}', '${r.text}', '${r.evidenceLink}')">💬 Notificar al Grupo</button>
                    </div>
                </div>`).join('');
        }

        // --- SUPER Y GASTOS MANTIENEN LÓGICA PREVIA ---
        function addSuper() {
            const text = document.getElementById('supItem').value.trim();
            if(!text) return;
            supermarket.push({ id: 's_' + Date.now(), item: text, completed: false });
            document.getElementById('supItem').value = ''; saveData();
        }
        function toggleSup(id) { const s = supermarket.find(x => x.id === id); if(s) { s.completed = !s.completed; saveData(); } }
        function deleteSup(id) { supermarket = supermarket.filter(s => s.id !== id); saveData(); }
        
        function renderSuper() {
            const container = document.getElementById('super-content');
            container.innerHTML = supermarket.length === 0 ? '' : supermarket.map(s => `
                <div style="display:flex; align-items:center; padding:12px 0; border-bottom:1px solid #eee; ${s.completed?'opacity:0.5; text-decoration:line-through;':''}">
                    <input type="checkbox" style="margin-right:12px; width:20px;height:20px;" ${s.completed ? 'checked' : ''} onchange="toggleSup('${s.id}')">
                    <span style="flex:1;">${s.item}</span>
                    <button class="btn-del" onclick="deleteSup('${s.id}')">🗑️</button>
                </div>`).join('');
        }

        function addExpense() {
            const concept = document.getElementById('expConcept').value.trim();
            const amt = parseFloat(document.getElementById('expAmount').value);
            const cur = document.getElementById('expCurrency').value;
            if(!concept || isNaN(amt)) return;
            expenses.push({ id: 'e_' + Date.now(), concept: concept, originalAmount: amt, currency: cur, amountUsd: cur === 'AWG' ? (amt / TASA_FLORIN) : amt, paidBy: document.getElementById('expPerson').value, date: new Date().toLocaleDateString() });
            document.getElementById('expConcept').value = ''; document.getElementById('expAmount').value = ''; saveData();
        }
        function deleteExp(id) { expenses = expenses.filter(e => e.id !== id); saveData(); }

        function renderExpenses() {
            const list = document.getElementById('expenses-list');
            list.innerHTML = expenses.map(e => `
                <div class="exp-item">
                    <div><strong>${e.concept}</strong><br><small>${e.date} • Pagó ${e.paidBy}</small></div>
                    <div style="font-weight:700;">${e.currency==='AWG'?`<small style="color:#888;">(${e.originalAmount} AWG)</small>`:''} $${e.amountUsd.toFixed(2)} <button class="btn-del" onclick="deleteExp('${e.id}')">🗑️</button></div>
                </div>`).join('');
            
            let b = { 'Daniel': 0, 'Carlos': 0, 'Miguel': 0, 'Desiree': 0 };
            expenses.forEach(e => { b[e.paidBy] += e.amountUsd; for (let p in b) b[p] -= (e.amountUsd / 4); });
            document.getElementById('balances-content').innerHTML = Object.keys(b).map(p => `
                <div class="balance-card ${b[p] > 0.01 ? 'positive' : b[p] < -0.01 ? 'negative' : ''}">
                    <div>${p}</div><div style="font-size:20px; font-weight:700; margin-top:4px;">${b[p] > 0.01 ? '+' : ''}$${b[p].toFixed(2)}</div>
                </div>`).join('');
        }

        // --- SINCRONIZACIÓN ---
        function saveData() {
            localStorage.setItem('ar26_it', JSON.stringify(itinerary)); localStorage.setItem('ar26_res', JSON.stringify(reservations));
            localStorage.setItem('ar26_sup', JSON.stringify(supermarket)); localStorage.setItem('ar26_exp', JSON.stringify(expenses));
            renderAll(); syncWithCloud('POST');
        }

        async function syncWithCloud(method = 'GET') {
            const status = document.getElementById('sync-status');
            if (!GAS_WEB_APP_URL) { status.innerHTML = '🔴 Local'; return; }
            status.innerHTML = '🟡 Guardando...';
            try {
                if (method === 'POST') {
                    await fetch(GAS_WEB_APP_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'text/plain'}, body: JSON.stringify({ itinerary, reservations, supermarket, expenses }) });
                    status.innerHTML = '🟢 Sincronizado';
                } else {
                    const res = await fetch(GAS_WEB_APP_URL); const data = await res.json();
                    if(data.itinerary) itinerary = data.itinerary; if(data.reservations) reservations = data.reservations;
                    if(data.supermarket) supermarket = data.supermarket; if(data.expenses) expenses = data.expenses;
                    saveData(); status.innerHTML = '🟢 Sincronizado';
                }
            } catch (e) { status.innerHTML = '🔴 Sin red'; }
        }
    </script>
</body>
</html>
